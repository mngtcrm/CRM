<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Implantação · CRM Armazena Mais</title>
<style>
  :root{
    --bg:#F4F6FA;
    --panel:#FFFFFF;
    --line:#E9EBF1;
    --line-soft:#F1F3F8;
    --ink:#1B1F27;
    --ink-soft:#6B7280;
    --ink-faint:#9AA0AC;
    --accent:#3E6DF0;
    --accent-dark:#2E52C2;
    --accent-soft:#EAF0FE;
    --amber:#C77B22;
    --amber-soft:#FBEEDD;
    --sage:#2F8F5B;
    --sage-dark:#20693F;
    --sage-soft:#E4F5EB;
    --rust:#D14343;
    --rust-dark:#A93333;
    --rust-soft:#FBEAEA;
    --radius:14px;
    --radius-sm:8px;
    --shadow: 0 1px 2px rgba(20,22,30,.04), 0 6px 16px rgba(20,22,30,.04);
    --shadow-modal: 0 20px 60px rgba(15,20,35,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  button, select, input, textarea{ font-family:inherit; }

  .app{ display:flex; min-height:100vh; }

  /* ---------------- sidebar ---------------- */
  .sidebar{
    width:236px; flex:0 0 236px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:22px 16px;
    display:flex; flex-direction:column; gap:22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand .mark{
    width:34px; height:34px; border-radius:10px; background:var(--accent);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex:0 0 34px;
  }
  .brand .name{ font-size:14.5px; font-weight:700; letter-spacing:-.01em; }
  .brand .sub{ font-size:11.5px; color:var(--ink-soft); }

  .sidebar-section-label{
    font-size:10.8px; color:var(--ink-faint); font-weight:700;
    letter-spacing:.03em; padding:0 6px; margin-bottom:4px;
  }
  .phase-list{ display:flex; flex-direction:column; gap:1px; overflow-y:auto; }
  .phase-item{
    display:flex; align-items:center; gap:9px;
    padding:8px 8px; border-radius:var(--radius-sm);
    cursor:pointer; color:var(--ink-soft); font-size:12.7px;
  }
  .phase-item:hover{ background:var(--line-soft); }
  .phase-item.active{ background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }
  .phase-item .num{
    width:20px; height:20px; flex:0 0 20px;
    border-radius:6px; background:var(--line-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; color:var(--ink-faint);
  }
  .phase-item.active .num{ background:var(--accent); color:#fff; }
  .phase-item .label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .phase-item .mini-bar{ width:24px; height:4px; border-radius:99px; background:var(--line); flex:0 0 24px; overflow:hidden; }
  .phase-item .mini-fill{ height:100%; background:var(--sage); }

  /* ---------------- main ---------------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .storage-banner{
    background:var(--amber-soft); color:#8A5313; font-size:12px; text-align:center;
    padding:7px 12px; border-bottom:1px solid #EBD3AC;
  }
  .topbar{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:18px 26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .topbar h1{ font-size:19px; margin:0; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .search-wrap{ position:relative; flex:1; min-width:180px; max-width:300px; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.4; }
  .search{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:99px;
    padding:8px 14px 8px 34px; font-size:13px; color:var(--ink);
  }
  .search::placeholder{ color:var(--ink-faint); }
  .date-badge{
    border:1px solid var(--line); border-radius:99px; padding:8px 16px;
    font-size:12.8px; color:var(--ink-soft); white-space:nowrap; background:var(--bg);
  }
  .new-task-btn{
    background:var(--accent); color:#fff; border:none;
    padding:9px 18px; border-radius:99px;
    font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .new-task-btn:hover{ background:var(--accent-dark); }

  .account{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .account select{ border:1px solid var(--line); background:var(--bg); border-radius:99px; font-size:12.3px; color:var(--ink); cursor:pointer; padding:6px 10px; }
  .account .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--accent);
    color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--panel); box-shadow:0 0 0 1.5px var(--line);
  }
  .google-pill{
    font-size:11px; color:var(--ink-faint); border:1px dashed var(--line);
    border-radius:99px; padding:6px 12px; cursor:not-allowed; white-space:nowrap;
  }

  /* ---------------- subbar ---------------- */
  .subbar{ padding:16px 26px 14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .subbar-left{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .subbar-title{ font-size:15px; font-weight:700; color:var(--ink); }
  .avatar-stack{ display:flex; }
  .avatar-stack .dot{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; color:#fff; border:2.5px solid var(--panel); margin-left:-9px;
  }
  .avatar-stack .dot:first-child{ margin-left:0; }

  .view-toggle{ display:flex; background:var(--bg); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .view-toggle button{ border:none; background:transparent; padding:7px 16px; font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:600; }
  .view-toggle button.active{ background:var(--panel); color:var(--ink); box-shadow: inset 0 0 0 1px var(--line); border-radius:99px; }

  .filter-row{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .avatar-chip{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--panel);
    border-radius:99px; padding:4px 10px 4px 4px; cursor:pointer; font-size:12.2px; color:var(--ink-soft);
  }
  .avatar-chip .dot{ width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9.2px; font-weight:700; color:#fff; }
  .avatar-chip.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }

  /* ---------------- layout: board + right panel ---------------- */
  .workspace{ flex:1; display:flex; gap:18px; padding:0 26px 26px; overflow:hidden; align-items:flex-start; }
  .content{ flex:1; min-width:0; overflow:auto; padding-top:2px; }
  .board{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start; }

  .column-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 6px 12px; }
  .column-head .title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .column-head .dot{ width:8px; height:8px; border-radius:50%; }
  .column[data-status="todo"] .dot{ background:var(--ink-faint); }
  .column[data-status="doing"] .dot{ background:var(--accent); }
  .column[data-status="done"] .dot{ background:var(--sage); }
  .column-head .count{ font-size:11.5px; color:var(--ink-faint); background:var(--line-soft); border-radius:99px; padding:2px 8px; }

  .card-list{ display:flex; flex-direction:column; gap:10px; min-height:60px; padding:2px; border-radius:var(--radius); }
  .card-list.drag-over{ background:var(--accent-soft); }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 15px 13px; box-shadow:var(--shadow); cursor:grab; }
  .card.dragging{ opacity:.4; }
  .tag-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .card .fase-tag{
    display:inline-block; font-size:10.5px; font-weight:600; color:var(--accent-dark);
    background:var(--accent-soft); border-radius:99px; padding:3px 10px;
  }
  .prio-tag{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:99px; padding:3px 10px; }
  .prio-alta{ background:var(--rust-soft); color:var(--rust-dark); }
  .prio-media{ background:var(--amber-soft); color:#8A5313; }
  .prio-baixa{ background:var(--sage-soft); color:var(--sage-dark); }

  .card h3{ margin:0 0 12px; font-size:13.4px; font-weight:600; line-height:1.4; color:var(--ink); cursor:pointer; }
  .card h3:hover{ color:var(--accent-dark); text-decoration:underline; }
  .column[data-status="done"] .card h3{ color:var(--ink-faint); text-decoration:line-through; }
  .column[data-status="done"] .card h3:hover{ text-decoration:underline; }

  .card-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .resp-pill{ display:flex; align-items:center; gap:6px; }
  .resp-pill .dot{ width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; flex:0 0 20px; }
  select.resp-select{ border:none; background:transparent; font-size:11.5px; color:var(--ink-soft); cursor:pointer; max-width:104px; }
  input.prazo-input{ font-size:11.3px; border:1px solid var(--line); border-radius:var(--radius-sm); padding:3px 6px; color:var(--ink-soft); background:var(--bg); }
  input.prazo-input.overdue{ border-color:var(--rust); color:var(--rust); background:var(--rust-soft); }

  .card-actions{ display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .btn{
    border:1px solid var(--line); background:var(--bg); color:var(--ink-soft);
    border-radius:var(--radius-sm); padding:7px 12px; font-size:12px; font-weight:600;
    cursor:pointer; line-height:1; transition:filter .1s ease;
  }
  .btn:hover{ filter:brightness(0.97); }
  .btn-start{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-start:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
  .btn-done{ background:var(--sage); border-color:var(--sage); color:#fff; }
  .btn-done:hover{ background:var(--sage-dark); border-color:var(--sage-dark); }
  .btn-neutral{ background:var(--panel); border-color:var(--line); color:var(--ink-soft); }
  .btn-neutral:hover{ background:var(--line-soft); }
  .btn-del{ background:var(--panel); border-color:var(--rust-soft); color:var(--rust); margin-left:auto; }
  .btn-del:hover{ background:var(--rust); border-color:var(--rust); color:#fff; }

  .empty-hint{ font-size:12px; color:var(--ink-faint); text-align:center; padding:20px 8px; border:1px dashed var(--line); border-radius:var(--radius); }
  .add-inline-btn{
    width:100%; margin-top:2px; background:var(--accent-soft); color:var(--accent-dark); border:1px dashed #B9CBFA;
    border-radius:var(--radius); padding:11px; font-size:12.8px; font-weight:700; cursor:pointer;
  }
  .add-inline-btn:hover{ background:#DEE8FE; }

  /* ---------------- list view ---------------- */
  .list-view{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11.3px; color:var(--ink-faint); font-weight:600; padding:11px 16px; border-bottom:1px solid var(--line); background:var(--bg); }
  tbody td{ padding:10px 16px; border-bottom:1px solid var(--line-soft); font-size:12.7px; vertical-align:middle; }
  tbody tr:hover{ background:var(--line-soft); }
  tbody tr:last-child td{ border-bottom:none; }
  .list-title-btn{ background:none; border:none; padding:0; text-align:left; font-size:12.7px; color:var(--ink); cursor:pointer; font-weight:600; }
  .list-title-btn:hover{ color:var(--accent-dark); text-decoration:underline; }
  .status-select{ border:1px solid var(--line); border-radius:99px; padding:4px 9px; font-size:11.3px; background:var(--bg); color:var(--ink-soft); }
  .status-select[data-val="done"]{ color:var(--sage); background:var(--sage-soft); border-color:transparent; }
  .status-select[data-val="doing"]{ color:var(--accent-dark); background:var(--accent-soft); border-color:transparent; }
  .status-select[data-val="todo"]{ color:var(--ink-soft); background:var(--line-soft); border-color:transparent; }
  table .btn-del{ padding:5px 10px; font-size:11.3px; margin-left:0; }

  /* ---------------- right panel ---------------- */
  .right-panel{ width:288px; flex:0 0 288px; display:flex; flex-direction:column; gap:16px; }
  .panel-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .panel-title{ font-size:13px; font-weight:700; margin:0 0 12px; }

  .upcoming-item{ display:flex; gap:10px; padding:8px 0; }
  .upcoming-item .bar{ width:3px; border-radius:99px; align-self:stretch; }
  .upcoming-item .meta{ font-size:11px; color:var(--ink-faint); margin-bottom:2px; }
  .upcoming-item .title{ font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.35; }
  .upcoming-item + .upcoming-item{ border-top:1px solid var(--line-soft); }

  .activity-item{ display:flex; gap:10px; padding:9px 0; }
  .activity-item + .activity-item{ border-top:1px solid var(--line-soft); }
  .activity-item .dot{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; flex:0 0 26px; }
  .activity-item .txt{ font-size:12.3px; color:var(--ink-soft); line-height:1.4; }
  .activity-item .txt b{ color:var(--ink); font-weight:600; }
  .activity-item .txt .who{ color:var(--accent-dark); font-weight:600; }
  .activity-item .time{ font-size:10.8px; color:var(--ink-faint); margin-top:2px; }

  .hidden{ display:none !important; }

  /* ---------------- modal ---------------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(17,21,33,.48);
    display:flex; align-items:center; justify-content:center; padding:20px;
    z-index:100; opacity:0; transition:opacity .15s ease;
  }
  .modal-overlay.show{ opacity:1; }
  .modal-box{
    background:var(--panel); border-radius:16px; width:100%; max-width:460px;
    box-shadow:var(--shadow-modal); max-height:88vh; display:flex; flex-direction:column;
    transform:translateY(8px); transition:transform .15s ease;
  }
  .modal-overlay.show .modal-box{ transform:translateY(0); }
  .modal-box.wide{ max-width:620px; }
  .modal-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 22px 4px; }
  .modal-header h2{ font-size:16.5px; margin:0; font-weight:700; }
  .modal-header .modal-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .modal-close{ background:none; border:none; color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 2px; white-space:nowrap; }
  .modal-close:hover{ color:var(--ink); text-decoration:underline; }
  .modal-body{ padding:16px 22px 22px; overflow-y:auto; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field .req{ color:var(--rust); }
  .field input[type=text], .field input[type=date], .field input[type=url], .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--bg); border-radius:var(--radius-sm);
    padding:9px 11px; font-size:13px; color:var(--ink); resize:vertical;
  }
  .field textarea{ min-height:72px; line-height:1.4; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .field-error{ font-size:11.5px; color:var(--rust); margin-top:5px; display:none; }
  .field.invalid input, .field.invalid textarea{ border-color:var(--rust); background:var(--rust-soft); }
  .field.invalid .field-error{ display:block; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }

  .modal-note{ background:var(--bg); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.3px; color:var(--ink-soft); margin-bottom:16px; }
  .modal-note b{ color:var(--ink); }

  .modal-footer{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .modal-footer .btn{ padding:9px 18px; font-size:12.8px; }
  .modal-footer .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .modal-footer .btn-primary:hover{ background:var(--accent-dark); }
  .modal-footer .btn-primary.sage{ background:var(--sage); border-color:var(--sage); }
  .modal-footer .btn-primary.sage:hover{ background:var(--sage-dark); }
  .modal-footer .btn-primary.danger{ background:var(--rust); border-color:var(--rust); }
  .modal-footer .btn-primary.danger:hover{ background:var(--rust-dark); }

  .detail-meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:16px; }
  .detail-meta .mi-label{ font-size:10.8px; color:var(--ink-faint); font-weight:700; letter-spacing:.02em; margin-bottom:2px; }
  .detail-meta .mi-val{ font-size:12.8px; color:var(--ink); }
  .detail-desc{ font-size:12.8px; color:var(--ink-soft); background:var(--bg); border-radius:var(--radius-sm); padding:12px; margin-bottom:16px; white-space:pre-wrap; line-height:1.5; }
  .detail-section-title{ font-size:12px; font-weight:700; color:var(--ink); margin:0 0 8px; }
  .notes-thread{ display:flex; flex-direction:column; gap:10px; max-height:220px; overflow-y:auto; margin-bottom:14px; padding-right:4px; }
  .note-item{ display:flex; gap:9px; }
  .note-item .dot{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:#fff; flex:0 0 24px; }
  .note-item .note-body{ background:var(--bg); border-radius:var(--radius-sm); padding:9px 11px; flex:1; }
  .note-item .note-head{ display:flex; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .note-item .note-who{ font-size:11.8px; font-weight:700; color:var(--ink); }
  .note-item .note-time{ font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
  .note-item .note-type{ display:inline-block; font-size:9.8px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--accent-dark); margin-bottom:3px; }
  .note-item .note-txt{ font-size:12.3px; color:var(--ink-soft); white-space:pre-wrap; line-height:1.4; }
  .add-note-row{ display:flex; gap:8px; align-items:flex-start; }
  .add-note-row textarea{ flex:1; min-height:44px; }
  .add-note-row button{ flex:0 0 auto; }
  .detail-footer{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }

  /* ---------------- toasts ---------------- */
  .toast-root{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast{
    background:var(--ink); color:#fff; font-size:12.8px; padding:11px 16px; border-radius:var(--radius-sm);
    box-shadow:0 8px 24px rgba(0,0,0,.2); opacity:0; transform:translateY(6px); transition:all .2s ease;
    max-width:300px;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ background:var(--sage-dark); }
  .toast.danger{ background:var(--rust-dark); }

  @media (max-width:1180px){ .right-panel{ display:none; } }
  @media (max-width:960px){ .sidebar{ display:none; } .board{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .modal-box{ max-width:100%; } .field-row{ flex-direction:column; gap:0; } .detail-meta{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="mark">AM</div>
      <div>
        <div class="name">Armazena Mais</div>
        <div class="sub">Plano de implantação CRM</div>
      </div>
    </div>
    <div>
      <div class="sidebar-section-label">FASES</div>
      <div class="phase-list" id="phaseList"></div>
    </div>
  </aside>

  <div class="main">
    <div class="storage-banner hidden" id="storageBanner"></div>
    <div class="topbar">
      <h1 id="pageTitle">Todas as fases</h1>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="search" id="search" placeholder="Buscar tarefa...">
      </div>
      <span class="date-badge" id="dateBadge"></span>
      <button class="new-task-btn" id="addTaskBtn">Nova tarefa</button>
      <div class="account">
        <span class="google-pill" title="Protótipo — login Google real requer hospedagem própria com backend">Entrar com Google</span>
        <select id="whoami"></select>
        <span class="avatar" id="whoamiAvatar">?</span>
      </div>
    </div>

    <div class="subbar">

const hasSharedStorage = (typeof window !== 'undefined') && !!window.storage;

async function storageGet(key){
  if(hasSharedStorage){
    try{ const r = await window.storage.get(key, true); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasSharedStorage){
    try{ await window.storage.set(key, value, true); return; }
    catch(e){ console.error('storage.set failed', e); return; }
  }
  try{ localStorage.setItem(key, value); }catch(e){ console.error('localStorage failed', e); }
}

let tasks = [];
let activity = [];
let activeRespFilter = "all";
let activeFaseFilter = "all";
let searchTerm = "";
let currentView = "kanban";
let draggedId = null;

function uid(){ return 't' + Math.random().toString(36).slice(2,10); }

function seed(){
  const now = Date.now();
  return SEED_TASKS.map(([fase,titulo,responsavel,prazo,prioridade]) => ({
    id: uid(), fase, titulo, responsavel, prazo, status: "todo",
    prioridade: prioridade || 'media', descricao: '',
    createdAt: now, startedAt: null, completedAt: null, completionLink: '', notas: []
  }));
}

/* backfill fields for tasks saved by earlier versions of this board */
function normalizeTask(t){
  if(t.prioridade === undefined) t.prioridade = 'media';
  if(t.descricao === undefined) t.descricao = '';
  if(t.createdAt === undefined) t.createdAt = Date.now();
  if(t.startedAt === undefined) t.startedAt = null;
  if(t.completedAt === undefined) t.completedAt = null;
  if(t.completionLink === undefined) t.completionLink = '';
  if(!Array.isArray(t.notas)) t.notas = [];
  return t;
}

async function loadTasks(){
  const raw = await storageGet(TASKS_KEY);
  if(raw){
    try{ tasks = JSON.parse(raw).map(normalizeTask); return; }
    catch(e){ /* corrupted, reseed below */ }
  }
  tasks = seed();
  await saveTasks();
}
async function saveTasks(){ await storageSet(TASKS_KEY, JSON.stringify(tasks)); }

async function loadActivity(){
  const raw = await storageGet(ACTIVITY_KEY);
  if(raw){ try{ activity = JSON.parse(raw); return; }catch(e){ /* corrupted */ } }
  activity = [];
}
async function saveActivity(){ await storageSet(ACTIVITY_KEY, JSON.stringify(activity)); }

async function logActivity(text){
  const who = document.getElementById('whoami').value;
  activity.unshift({ id: uid(), who, text, ts: Date.now() });
  activity = activity.slice(0, 25);
  await saveActivity();
}

function timeAgo(ts){
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff/60000);
  if(min < 1) return "agora";
  if(min < 60) return "há " + min + " min";
  const h = Math.floor(min/60);
  if(h < 24) return "há " + h + " h";
  const d = Math.floor(h/24);
  return "há " + d + " d";
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
}
function fmtDateFull(iso){
  if(!iso) return "—";
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
}

/* ============ toasts ============ */
function toast(msg, type){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 2800);
}

/* ============ modal shell ============ */
function closeModal(){
  const overlay = document.querySelector('.modal-overlay');
  if(overlay){
    overlay.classList.remove('show');
    setTimeout(() => overlay.remove(), 150);
  }
  document.removeEventListener('keydown', modalEscHandler);
}
function modalEscHandler(e){ if(e.key === 'Escape') closeModal(); }

function openModal({title, subtitle, wide, bodyHtml, onMount}){
  closeModal();
  const container = document.getElementById('modalContainer');
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.innerHTML = `
    <div class="modal-box ${wide?'wide':''}" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <h2>${title}</h2>
          ${subtitle ? `<div class="modal-sub">${subtitle}</div>` : ''}
        </div>
        <button class="modal-close" id="modalCloseX">Fechar</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
  container.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('show'));
  wrap.addEventListener('mousedown', e => { if(e.target === wrap) closeModal(); });
  wrap.querySelector('#modalCloseX').addEventListener('click', closeModal);
  document.addEventListener('keydown', modalEscHandler);
  if(onMount) onMount(wrap);
  const firstField = wrap.querySelector('input, textarea, select');
  if(firstField) setTimeout(() => firstField.focus(), 50);
  return wrap;
}

function markInvalid(fieldEl, msg){
  fieldEl.classList.add('invalid');
  const err = fieldEl.querySelector('.field-error');
  if(err) err.textContent = msg;
}
function clearInvalid(fieldEl){ fieldEl.classList.remove('invalid'); }

/* ============ shared select/option builders ============ */
function faseOptionsHtml(selected){
  return Object.keys(FASE_LABELS).map(f =>
    `<option value="${f}" ${String(f)===String(selected)?'selected':''}>Fase ${f} · ${FASE_LABELS[f]}</option>`).join('');
}
function respOptionsHtml(selected){
  return RESPONSAVEIS.map(r => `<option value="${r}" ${r===selected?'selected':''}>${escapeHtml(r)}</option>`).join('');
}
function prioOptionsHtml(selected){
  return Object.keys(PRIORIDADES).map(p => `<option value="${p}" ${p===selected?'selected':''}>${PRIORIDADES[p]}</option>`).join('');
}

          <div class="field"><label>Prioridade</label><select id="et-prioridade">${prioOptionsHtml(t.prioridade)}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Responsável</label><select id="et-responsavel">${respOptionsHtml(t.responsavel)}</select></div>
          <div class="field"><label>Prazo</label><input type="date" id="et-prazo" value="${t.prazo||''}"></div>
        </div>
        <div class="field"><label>Descrição / contexto</label><textarea id="et-descricao" maxlength="600">${escapeHtml(t.descricao||'')}</textarea></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-neutral" id="et-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>
      </form>`,
    onMount: (wrap) => {
      wrap.querySelector('#et-cancel').addEventListener('click', () => openDetailModal(taskId));
      wrap.querySelector('#editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const tituloEl = wrap.querySelector('#et-titulo');
        const titulo = tituloEl.value.trim();
        const fEl = wrap.querySelector('#f-etitulo');
        if(!titulo){ markInvalid(fEl, 'Digite um título para a tarefa.'); tituloEl.focus(); return; }
        clearInvalid(fEl);
        t.titulo = titulo;
        t.fase = parseInt(wrap.querySelector('#et-fase').value);
        t.prioridade = wrap.querySelector('#et-prioridade').value;
        t.responsavel = wrap.querySelector('#et-responsavel').value;
        t.prazo = wrap.querySelector('#et-prazo').value;
        t.descricao = wrap.querySelector('#et-descricao').value.trim();
        await saveTasks();
        await logActivity(`editou <b>${escapeHtml(t.titulo)}</b>`);
        closeModal();
        toast('Alterações salvas.', 'success');
        render();
      });
    }
  });
}

/* ============ Task Detail modal ============ */
function noteTypeLabel(tipo){
  return tipo === 'inicio' ? 'Início' : (tipo === 'conclusao' ? 'Conclusão' : 'Nota');
}
function renderNotesThread(t){
  if(!t.notas.length) return `<div class="empty-hint">Nenhuma nota registrada ainda.</div>`;
  return t.notas.map(n => `
    <div class="note-item">
      <span class="dot" style="background:${RESP_COLORS[n.who]||'#999'}">${initials(n.who)}</span>
      <div class="note-body">
        <div class="note-head"><span class="note-who">${escapeHtml(n.who)}</span><span class="note-time">${timeAgo(n.ts)}</span></div>
        <div class="note-type">${noteTypeLabel(n.tipo)}</div>
        <div class="note-txt">${escapeHtml(n.texto)}</div>
      </div>
    </div>`).join('');
}
function openDetailModal(taskId){
  const t = tasks.find(x => x.id === taskId);
  if(!t) return;
  const overdue = isOverdue(t.prazo, t.status);
  openModal({
    title: escapeHtml(t.titulo),
    wide: true,
    bodyHtml: `
      <div class="tag-row">
        <span class="fase-tag">Fase ${t.fase} · ${escapeHtml(FASE_LABELS[t.fase]||'')}</span>
        <span class="prio-tag prio-${t.prioridade}">${PRIORIDADES[t.prioridade]}</span>
      </div>
      <div class="detail-meta">
        <div><div class="mi-label">RESPONSÁVEL</div><div class="mi-val">${escapeHtml(t.responsavel)}</div></div>
        <div><div class="mi-label">STATUS</div><div class="mi-val">${statusLabel(t.status)}</div></div>
        <div><div class="mi-label">PRAZO</div><div class="mi-val" style="${overdue?'color:var(--rust);font-weight:700;':''}">${t.prazo ? fmtDateFull(t.prazo) + (overdue?' · vencido':'') : 'Sem prazo definido'}</div></div>
        <div><div class="mi-label">CRIADA EM</div><div class="mi-val">${new Date(t.createdAt).toLocaleDateString('pt-BR')}</div></div>
        ${t.startedAt ? `<div><div class="mi-label">INICIADA EM</div><div class="mi-val">${fmtDateFull(t.startedAt)}</div></div>` : ''}
        ${t.completedAt ? `<div><div class="mi-label">CONCLUÍDA EM</div><div class="mi-val">${fmtDateFull(t.completedAt)}</div></div>` : ''}
      </div>
      ${t.descricao ? `<div class="detail-section-title">Descrição</div><div class="detail-desc">${escapeHtml(t.descricao)}</div>` : ''}
      ${t.completionLink ? `<div class="detail-section-title">Link do entregável</div><div class="detail-desc"><a href="${escapeHtml(t.completionLink)}" target="_blank" rel="noopener">${escapeHtml(t.completionLink)}</a></div>` : ''}
      <div class="detail-section-title">Histórico</div>
      <div class="notes-thread" id="notesThread">${renderNotesThread(t)}</div>
      <div class="add-note-row">
        <textarea id="quickNote" maxlength="400" placeholder="Adicionar uma nota de atualização..."></textarea>
        <button type="button" class="btn btn-neutral" id="addNoteBtn">Adicionar nota</button>
      </div>
      <div class="detail-footer">
        <button type="button" class="btn btn-neutral" id="d-edit">Editar</button>
        ${t.status !== 'todo' ? `<button type="button" class="btn btn-neutral" id="d-todo">Voltar para a fazer</button>` : ''}
        ${t.status !== 'doing' ? `<button type="button" class="btn ${t.status==='todo'?'btn-start':'btn-neutral'}" id="d-start">${t.status==='todo'?'Iniciar':'Reabrir'}</button>` : ''}
        ${t.status !== 'done' ? `<button type="button" class="btn btn-done" id="d-done">Concluir</button>` : ''}
        <button type="button" class="btn btn-del" id="d-del">Excluir</button>
      </div>
    `,
    onMount: (wrap) => {
      wrap.querySelector('#d-edit').addEventListener('click', () => openEditModal(taskId));
      const todoBtn = wrap.querySelector('#d-todo');
      if(todoBtn) todoBtn.addEventListener('click', async () => {
        const old = t.status; t.status = 'todo'; await saveTasks();
        await logActivity(statusMoveText(t, old)); closeModal(); toast('Tarefa movida para A fazer.', 'success'); render();
      });
      const startBtn = wrap.querySelector('#d-start');
      if(startBtn) startBtn.addEventListener('click', () => { closeModal(); openStartModal(taskId); });
      const doneBtn = wrap.querySelector('#d-done');
      if(doneBtn) doneBtn.addEventListener('click', () => { closeModal(); openCompleteModal(taskId); });
      wrap.querySelector('#d-del').addEventListener('click', () => { closeModal(); openDeleteModal(taskId); });
      wrap.querySelector('#addNoteBtn').addEventListener('click', async () => {
        const ta = wrap.querySelector('#quickNote');
        const texto = ta.value.trim();
        if(!texto) { ta.focus(); return; }
        const who = document.getElementById('whoami').value;
        t.notas.unshift({ id: uid(), ts: Date.now(), who, texto, tipo: 'nota' });
        await saveTasks();
        await logActivity(`comentou em <b>${escapeHtml(t.titulo)}</b>`);
        wrap.querySelector('#notesThread').innerHTML = renderNotesThread(t);
        ta.value = '';
        renderActivity();
      });
    }
  });
}

/* ============ whoami / avatars ============ */
function populateWhoami(){
  const sel = document.getElementById('whoami');
  sel.innerHTML = RESPONSAVEIS.map(r => `<option value="${r}">${escapeHtml(r)}</option>`).join('');
  const saved = localStorage.getItem(WHOAMI_KEY);
  if(saved && RESPONSAVEIS.includes(saved)) sel.value = saved;
  sel.addEventListener('change', () => {
    updateAvatar();
    try{ localStorage.setItem(WHOAMI_KEY, sel.value); }catch(e){}
  });
  updateAvatar();
}
function updateAvatar(){
  const sel = document.getElementById('whoami');
  const av = document.getElementById('whoamiAvatar');
  av.textContent = initials(sel.value);
  av.style.background = RESP_COLORS[sel.value] || '#3E6DF0';
}
function populateAvatarStack(){
  document.getElementById('avatarStack').innerHTML = RESPONSAVEIS.map(r =>
    `<span class="dot" style="background:${RESP_COLORS[r]}" title="${escapeHtml(r)}">${initials(r)}</span>`).join('');
}

/* ============ sidebar / filters ============ */
function populatePhaseList(){
  const wrap = document.getElementById('phaseList');
  let html = `<div class="phase-item ${activeFaseFilter==='all'?'active':''}" data-fase="all"><div class="num">·</div><div class="label">Todas as fases</div></div>`;
  Object.keys(FASE_LABELS).forEach(f => {
    const pct = phaseProgress(f);
    html += `<div class="phase-item ${String(activeFaseFilter)===f?'active':''}" data-fase="${f}">
      <div class="num">${f}</div><div class="label">${FASE_LABELS[f]}</div>
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
    </div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.phase-item').forEach(item => {
    item.addEventListener('click', () => {
      activeFaseFilter = item.dataset.fase;
      const title = activeFaseFilter === 'all' ? 'Todas as fases' : ('Fase ' + activeFaseFilter + ' · ' + FASE_LABELS[activeFaseFilter]);
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('subbarTitle').textContent = title;
      populatePhaseList();
      render();
    });
  });
}
function phaseProgress(fase){
  const ft = tasks.filter(t => String(t.fase) === String(fase));
  if(!ft.length) return 0;
  return Math.round((ft.filter(t=>t.status==='done').length / ft.length) * 100);
}
function populateRespFilters(){
  const wrap = document.getElementById('respFilters');
  let html = `<span class="avatar-chip ${activeRespFilter==='all'?'active':''}" data-resp="all">Todos</span>`;
  RESPONSAVEIS.forEach(r => {
    html += `<span class="avatar-chip ${activeRespFilter===r?'active':''}" data-resp="${r}"><span class="dot" style="background:${RESP_COLORS[r]}">${initials(r)}</span>${escapeHtml(r)}</span>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.avatar-chip').forEach(chip => {
    chip.addEventListener('click', () => { activeRespFilter = chip.dataset.resp; populateRespFilters(); render(); });
  });
}

function isOverdue(prazo, status){
  if(!prazo || status === 'done') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(prazo + 'T00:00:00') < today;
}
function passesFilters(t){
  if(activeRespFilter !== 'all' && t.responsavel !== activeRespFilter) return false;
  if(activeFaseFilter !== 'all' && String(t.fase) !== String(activeFaseFilter)) return false;
  if(searchTerm){
    const s = searchTerm.toLowerCase();
    if(!t.titulo.toLowerCase().includes(s) && !(t.descricao||'').toLowerCase().includes(s)) return false;
  }
  return true;
}

/* ============ card / row rendering ============ */
function cardHTML(t){
  const respOptions = respOptionsHtml(t.responsavel);
  const overdueClass = isOverdue(t.prazo, t.status) ? 'overdue' : '';
  const color = RESP_COLORS[t.responsavel] || '#999';
  return `
  <div class="card" draggable="true" data-id="${t.id}">
    <div class="tag-row">
      <span class="fase-tag">Fase ${t.fase} · ${escapeHtml(FASE_LABELS[t.fase]||'')}</span>
      <span class="prio-tag prio-${t.prioridade}">${PRIORIDADES[t.prioridade]}</span>
    </div>
    <h3 data-detail="${t.id}">${escapeHtml(t.titulo)}</h3>
    <div class="card-row">
      <div class="resp-pill">
        <span class="dot" style="background:${color}">${initials(t.responsavel)}</span>
        <select class="resp-select" data-id="${t.id}">${respOptions}</select>
      </div>
      <input type="date" class="prazo-input ${overdueClass}" data-id="${t.id}" value="${t.prazo||''}">
    </div>
    <div class="card-actions">
      ${t.status !== 'todo' ? `<button class="btn btn-neutral" data-id="${t.id}" data-move="todo">A fazer</button>` : ''}
      ${t.status !== 'doing' ? `<button class="btn ${t.status==='todo'?'btn-start':'btn-neutral'}" data-id="${t.id}" data-start="1">${t.status==='todo'?'Iniciar':'Reabrir'}</button>` : ''}
      ${t.status !== 'done' ? `<button class="btn btn-done" data-id="${t.id}" data-complete="1">Concluir</button>` : ''}
      <button class="btn btn-del" data-id="${t.id}" data-del="1">Excluir</button>
    </div>
  </div>`;
}

function renderKanban(visible){
  ['todo','doing','done'].forEach(s => {
    const list = document.getElementById('list-' + s);
    const items = visible.filter(t => t.status === s).sort((a,b)=>(a.fase-b.fase)||(a.prazo||'').localeCompare(b.prazo||''));
    document.getElementById('count-'+s).textContent = items.length;
    list.innerHTML = (items.length ? items.map(cardHTML).join('') : `<div class="empty-hint">Sem tarefas aqui</div>`)
      + (s==='todo' ? `<button class="add-inline-btn" id="addInlineBtn">Nova tarefa</button>` : '');
  });
  const inlineBtn = document.getElementById('addInlineBtn');
  if(inlineBtn) inlineBtn.addEventListener('click', openNewTaskModal);
}

function renderList(visible){
  const body = document.getElementById('listBody');
  const items = [...visible].sort((a,b)=>(a.fase-b.fase)||(a.prazo||'').localeCompare(b.prazo||''));
  body.innerHTML = items.map(t => {
    const respOptions = respOptionsHtml(t.responsavel);
    const overdueClass = isOverdue(t.prazo, t.status) ? 'overdue' : '';
    return `<tr>
      <td>Fase ${t.fase}</td><td><button class="list-title-btn" data-detail="${t.id}">${escapeHtml(t.titulo)}</button></td>
      <td><select class="resp-select" data-id="${t.id}">${respOptions}</select></td>
      <td><input type="date" class="prazo-input ${overdueClass}" data-id="${t.id}" value="${t.prazo||''}"></td>
      <td><select class="status-select" data-id="${t.id}" data-val="${t.status}">
        <option value="todo" ${t.status==='todo'?'selected':''}>A fazer</option>
        <option value="doing" ${t.status==='doing'?'selected':''}>Em andamento</option>
        <option value="done" ${t.status==='done'?'selected':''}>Concluído</option>
      </select></td>
      <td><button class="btn btn-del" data-id="${t.id}" data-del="1">Excluir</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="6"><div class="empty-hint">Nenhuma tarefa encontrada</div></td></tr>`;

  body.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const t = tasks.find(x=>x.id===sel.dataset.id);
      if(!t) return;
      if(sel.value === 'doing' && t.status === 'todo'){ sel.value = t.status; openStartModal(t.id); return; }
      if(sel.value === 'done'){ sel.value = t.status; openCompleteModal(t.id); return; }
      const old = t.status; t.status = sel.value; await saveTasks(); await logActivity(statusMoveText(t, old)); render();
    });
  });
  body.querySelectorAll('[data-detail]').forEach(btn => btn.addEventListener('click', () => openDetailModal(btn.dataset.detail)));
  body.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => openDeleteModal(btn.dataset.id)));
  body.querySelectorAll('.resp-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const t = tasks.find(x => x.id === sel.dataset.id);
      if(t){ t.responsavel = sel.value; await saveTasks(); await logActivity(`reatribuiu <b>${escapeHtml(t.titulo)}</b> para ${escapeHtml(t.responsavel)}`); render(); }
    });
  });
  body.querySelectorAll('.prazo-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      const t = tasks.find(x => x.id === inp.dataset.id);
      if(t){ t.prazo = inp.value; await saveTasks(); await logActivity(`alterou o prazo de <b>${escapeHtml(t.titulo)}</b>`); render(); }
    });
  });
}

function statusLabel(s){ return s==='todo'?'A fazer':(s==='doing'?'Em andamento':'Concluído'); }
function statusMoveText(t, oldStatus){
  return `moveu <b>${escapeHtml(t.titulo)}</b> de ${statusLabel(oldStatus)} para ${statusLabel(t.status)}`;
}

function renderUpcoming(){
  const wrap = document.getElementById('upcomingList');
  const items = tasks.filter(t => t.status !== 'done' && t.prazo)
    .sort((a,b) => a.prazo.localeCompare(b.prazo)).slice(0,6);
  wrap.innerHTML = items.length ? items.map(t => `
    <div class="upcoming-item">
      <div class="bar" style="background:${RESP_COLORS[t.responsavel]||'#ccc'}"></div>
      <div>
        <div class="meta">${fmtDate(t.prazo)} · Fase ${t.fase}</div>
        <div class="title">${escapeHtml(t.titulo)}</div>
      </div>
    </div>`).join('') : `<div class="empty-hint">Nenhum prazo em aberto</div>`;
}
function renderActivity(){
  const wrap = document.getElementById('activityList');
  wrap.innerHTML = activity.length ? activity.slice(0,8).map(a => `
    <div class="activity-item">
      <span class="dot" style="background:${RESP_COLORS[a.who]||'#999'}">${initials(a.who)}</span>
      <div>
        <div class="txt"><span class="who">${escapeHtml(a.who)}</span> ${a.text}</div>
        <div class="time">${timeAgo(a.ts)}</div>
      </div>
    </div>`).join('') : `<div class="empty-hint">Sem atividade ainda</div>`;
}

function render(){
  const visible = tasks.filter(passesFilters);
  if(currentView === 'kanban'){ renderKanban(visible); } else { renderList(visible); }

  const total = tasks.length;
  const done = tasks.filter(t => t.status === 'done').length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '% concluído';

  attachSharedEvents();
  populatePhaseList();
  renderUpcoming();
  renderActivity();
}

function attachSharedEvents(){
  document.querySelectorAll('.resp-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const t = tasks.find(x => x.id === sel.dataset.id);
      if(t){ t.responsavel = sel.value; await saveTasks(); await logActivity(`reatribuiu <b>${escapeHtml(t.titulo)}</b> para ${escapeHtml(t.responsavel)}`); render(); }
    });
  });
  document.querySelectorAll('.prazo-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      const t = tasks.find(x => x.id === inp.dataset.id);
      if(t){ t.prazo = inp.value; await saveTasks(); await logActivity(`alterou o prazo de <b>${escapeHtml(t.titulo)}</b>`); render(); }
    });
  });
  document.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const t = tasks.find(x => x.id === btn.dataset.id);
      if(t){ const old = t.status; t.status = btn.dataset.move; await saveTasks(); await logActivity(statusMoveText(t, old)); render(); }
    });
  });
  document.querySelectorAll('[data-start]').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = tasks.find(x => x.id === btn.dataset.id);
      if(t && t.status === 'doing'){
        /* "Reabrir" from done/other back to doing — no form needed */
        (async () => { const old = t.status; t.status = 'doing'; await saveTasks(); await logActivity(statusMoveText(t, old)); render(); })();
      } else {
        openStartModal(btn.dataset.id);
      }
    });
  });
  document.querySelectorAll('[data-complete]').forEach(btn => btn.addEventListener('click', () => openCompleteModal(btn.dataset.id)));
  document.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => openDeleteModal(btn.dataset.id)));
  document.querySelectorAll('[data-detail]').forEach(el => el.addEventListener('click', () => openDetailModal(el.dataset.detail)));
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('dragstart', () => { draggedId = card.dataset.id; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); draggedId = null; });
  });
}

function attachColumnDrop(){
  document.querySelectorAll('.card-list').forEach(list => {
    list.addEventListener('dragover', e => { e.preventDefault(); list.classList.add('drag-over'); });
    list.addEventListener('dragleave', () => list.classList.remove('drag-over'));
    list.addEventListener('drop', async e => {
      e.preventDefault(); list.classList.remove('drag-over');
      if(!draggedId) return;
      const t = tasks.find(x => x.id === draggedId);
      if(!t) return;
      const targetStatus = list.dataset.status;
      if(targetStatus === 'doing' && t.status === 'todo'){ openStartModal(t.id); return; }
      if(targetStatus === 'done'){ openCompleteModal(t.id); return; }
      const old = t.status; t.status = targetStatus; await saveTasks(); await logActivity(statusMoveText(t, old)); render();
    });
  });
}

document.getElementById('addTaskBtn').addEventListener('click', openNewTaskModal);
document.getElementById('search').addEventListener('input', e => { searchTerm = e.target.value; render(); });

document.getElementById('viewKanbanBtn').addEventListener('click', () => {
  currentView = 'kanban';
  document.getElementById('viewKanbanBtn').classList.add('active');
  document.getElementById('viewListBtn').classList.remove('active');
  document.getElementById('board').classList.remove('hidden');
  document.getElementById('listView').classList.add('hidden');
  render();
});
document.getElementById('viewListBtn').addEventListener('click', () => {
  currentView = 'list';
  document.getElementById('viewListBtn').classList.add('active');
  document.getElementById('viewKanbanBtn').classList.remove('active');
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('board').classList.add('hidden');
  render();
});

function setDateBadge(){
  document.getElementById('dateBadge').textContent =
    new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});
}
function setStorageBanner(){
  const banner = document.getElementById('storageBanner');
  if(!hasSharedStorage){
    banner.textContent = "Este link está aberto fora do Claude — os dados ficam salvos só neste navegador, não são compartilhados com outros responsáveis ainda.";
    banner.classList.remove('hidden');
  }
}

async function init(){
  setDateBadge();
  setStorageBanner();
  populateWhoami();
  populateRespFilters();
  populateAvatarStack();
  await loadTasks();
  await loadActivity();
  render();
  attachColumnDrop();
}
init();
</script>
</body>
</html>
