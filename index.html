<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"></script>
<style>
  :root{
    --bg:#F4F6FA; --panel:#FFFFFF; --line:#E9EBF1; --line-soft:#F1F3F8;
    --ink:#1B1F27; --ink-soft:#6B7280; --ink-faint:#9AA0AC;
    --accent:#3E6DF0; --accent-dark:#2E52C2; --accent-soft:#EAF0FE;
    --amber:#C77B22; --amber-soft:#FBEEDD;
    --sage:#2F8F5B; --sage-dark:#20693F; --sage-soft:#E4F5EB;
    --rust:#D14343; --rust-dark:#A93333; --rust-soft:#FBEAEA;
    --radius:14px; --radius-sm:8px;
    --shadow: 0 1px 2px rgba(20,22,30,.04), 0 6px 16px rgba(20,22,30,.04);
    --shadow-modal: 0 20px 60px rgba(15,20,35,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; line-height:1.45; }
  button, select, input, textarea{ font-family:inherit; }
  .hidden{ display:none !important; }

  /* ---------------- login screen ---------------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#16223F,#233763);
  }
  .login-card{
    background:var(--panel); border-radius:20px; padding:40px 36px; width:100%; max-width:380px;
    box-shadow:var(--shadow-modal); text-align:center;
  }
  .login-card .mark{
    height:46px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;
  }
  .login-card .mark img{ height:100%; width:auto; object-fit:contain; }
  .login-card h1{ font-size:19px; margin:0 0 6px; font-weight:700; }
  .login-card p{ font-size:13px; color:var(--ink-soft); margin:0 0 26px; line-height:1.5; }
  #googleSignInDiv{ display:flex; justify-content:center; min-height:44px; }
  .login-status{ font-size:12px; color:var(--ink-faint); margin-top:16px; }
  .login-status.err{ color:var(--rust); }

  .app{ display:none; min-height:100vh; }
  .app.show{ display:flex; }

  /* ---------------- sidebar ---------------- */
  .sidebar{ width:236px; flex:0 0 236px; background:var(--panel); border-right:1px solid var(--line); padding:22px 16px; display:flex; flex-direction:column; gap:22px; }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand .mark{ height:30px; flex:0 0 auto; display:flex; align-items:center; }
  .brand .mark img{ height:100%; width:auto; object-fit:contain; }
  .brand .name{ font-size:14.5px; font-weight:700; letter-spacing:-.01em; }
  .brand .sub{ font-size:11.5px; color:var(--ink-soft); }
  .sidebar-section-label{ font-size:10.8px; color:var(--ink-faint); font-weight:700; letter-spacing:.03em; padding:0 6px; margin-bottom:4px; }
  .phase-list{ display:flex; flex-direction:column; gap:1px; overflow-y:auto; }
  .phase-item{ display:flex; align-items:center; gap:9px; padding:8px 8px; border-radius:var(--radius-sm); cursor:pointer; color:var(--ink-soft); font-size:12.7px; }
  .phase-item:hover{ background:var(--line-soft); }
  .phase-item.active{ background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }
  .phase-item .num{ width:20px; height:20px; flex:0 0 20px; border-radius:6px; background:var(--line-soft); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:var(--ink-faint); }
  .phase-item.active .num{ background:var(--accent); color:#fff; }
  .phase-item .label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .phase-item .mini-bar{ width:24px; height:4px; border-radius:99px; background:var(--line); flex:0 0 24px; overflow:hidden; }
  .phase-item .mini-fill{ height:100%; background:var(--sage); }

  /* ---------------- main ---------------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ background:var(--panel); border-bottom:1px solid var(--line); padding:18px 26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .topbar h1{ font-size:19px; margin:0; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .search-wrap{ position:relative; flex:1; min-width:180px; max-width:300px; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.4; }
  .search{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:8px 14px 8px 34px; font-size:13px; color:var(--ink); }
  .new-task-btn{ background:var(--accent); color:#fff; border:none; padding:9px 18px; border-radius:99px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .new-task-btn:hover{ background:var(--accent-dark); }
  .account{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .account .who{ font-size:12.5px; color:var(--ink); text-align:right; line-height:1.25; }
  .account .who .email{ display:block; font-size:11px; color:var(--ink-faint); }
  .account .avatar{ width:36px; height:36px; border-radius:50%; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--panel); box-shadow:0 0 0 1.5px var(--line); overflow:hidden; }
  .account .avatar img{ width:100%; height:100%; object-fit:cover; }
  .logout-btn{ font-size:12px; color:var(--ink-soft); background:none; border:1px solid var(--line); border-radius:99px; padding:6px 12px; cursor:pointer; font-weight:600; }
  .logout-btn:hover{ background:var(--line-soft); color:var(--ink); }

  .subbar{ padding:16px 26px 14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .subbar-title{ font-size:15px; font-weight:700; color:var(--ink); }
  .view-toggle{ display:flex; background:var(--bg); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .view-toggle button{ border:none; background:transparent; padding:7px 16px; font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:600; }
  .view-toggle button.active{ background:var(--panel); color:var(--ink); box-shadow: inset 0 0 0 1px var(--line); border-radius:99px; }
  .filter-row{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .avatar-chip{ display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); border-radius:99px; padding:4px 10px 4px 4px; cursor:pointer; font-size:12.2px; color:var(--ink-soft); }
  .avatar-chip .dot{ width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9.2px; font-weight:700; color:#fff; }
  .avatar-chip.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }

  .workspace{ flex:1; display:flex; gap:18px; padding:0 26px 26px; overflow:hidden; align-items:flex-start; }
  .content{ flex:1; min-width:0; overflow:auto; padding-top:2px; }
  .board{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start; }
  .column-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 6px 12px; }
  .column-head .title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .column-head .dot{ width:8px; height:8px; border-radius:50%; }
  .column[data-status="todo"] .dot{ background:var(--ink-faint); }
  .column[data-status="doing"] .dot{ background:var(--accent); }
  .column[data-status="done"] .dot{ background:var(--sage); }
  .column-head .count{ font-size:11.5px; color:var(--ink-faint); background:var(--line-soft); border-radius:99px; padding:2px 8px; }
  .card-list{ display:flex; flex-direction:column; gap:10px; min-height:60px; padding:2px; border-radius:var(--radius); }
  .card-list.drag-over{ background:var(--accent-soft); }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 15px 13px; box-shadow:var(--shadow); cursor:grab; }
  .card.dragging{ opacity:.4; }
  .tag-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .card .fase-tag{ display:inline-block; font-size:10.5px; font-weight:600; color:var(--accent-dark); background:var(--accent-soft); border-radius:99px; padding:3px 10px; }
  .prio-tag{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:99px; padding:3px 10px; }
  .prio-alta{ background:var(--rust-soft); color:var(--rust-dark); }
  .prio-media{ background:var(--amber-soft); color:#8A5313; }
  .prio-baixa{ background:var(--sage-soft); color:var(--sage-dark); }
  .card h3{ margin:0 0 12px; font-size:13.4px; font-weight:600; line-height:1.4; color:var(--ink); cursor:pointer; }
  .card h3:hover{ color:var(--accent-dark); text-decoration:underline; }
  .column[data-status="done"] .card h3{ color:var(--ink-faint); text-decoration:line-through; }
  .card-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .resp-pill{ display:flex; align-items:center; gap:6px; min-width:0; }
  .resp-pill .dot{ width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; flex:0 0 20px; }
  select.resp-select{ border:none; background:transparent; font-size:11.5px; color:var(--ink-soft); cursor:pointer; max-width:104px; }
  input.prazo-input{ font-size:11.3px; border:1px solid var(--line); border-radius:var(--radius-sm); padding:3px 6px; color:var(--ink-soft); background:var(--bg); }
  input.prazo-input.overdue{ border-color:var(--rust); color:var(--rust); background:var(--rust-soft); }
  .card-actions{ display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .btn{ border:1px solid var(--line); background:var(--bg); color:var(--ink-soft); border-radius:var(--radius-sm); padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer; line-height:1; }
  .btn:hover{ filter:brightness(0.97); }
  .btn-start{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-start:hover{ background:var(--accent-dark); }
  .btn-done{ background:var(--sage); border-color:var(--sage); color:#fff; }
  .btn-done:hover{ background:var(--sage-dark); }
  .btn-neutral{ background:var(--panel); border-color:var(--line); color:var(--ink-soft); }
  .btn-neutral:hover{ background:var(--line-soft); }
  .btn-del{ background:var(--panel); border-color:var(--rust-soft); color:var(--rust); margin-left:auto; }
  .btn-del:hover{ background:var(--rust); border-color:var(--rust); color:#fff; }
  .empty-hint{ font-size:12px; color:var(--ink-faint); text-align:center; padding:20px 8px; border:1px dashed var(--line); border-radius:var(--radius); }
  .add-inline-btn{ width:100%; margin-top:2px; background:var(--accent-soft); color:var(--accent-dark); border:1px dashed #B9CBFA; border-radius:var(--radius); padding:11px; font-size:12.8px; font-weight:700; cursor:pointer; }
  .add-inline-btn:hover{ background:#DEE8FE; }

  .list-view{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11.3px; color:var(--ink-faint); font-weight:600; padding:11px 16px; border-bottom:1px solid var(--line); background:var(--bg); }
  tbody td{ padding:10px 16px; border-bottom:1px solid var(--line-soft); font-size:12.7px; vertical-align:middle; }
  tbody tr:hover{ background:var(--line-soft); }
  tbody tr:last-child td{ border-bottom:none; }
  .list-title-btn{ background:none; border:none; padding:0; text-align:left; font-size:12.7px; color:var(--ink); cursor:pointer; font-weight:600; }
  .list-title-btn:hover{ color:var(--accent-dark); text-decoration:underline; }
  .status-select{ border:1px solid var(--line); border-radius:99px; padding:4px 9px; font-size:11.3px; background:var(--bg); color:var(--ink-soft); }
  .status-select[data-val="done"]{ color:var(--sage); background:var(--sage-soft); border-color:transparent; }
  .status-select[data-val="doing"]{ color:var(--accent-dark); background:var(--accent-soft); border-color:transparent; }
  .status-select[data-val="todo"]{ color:var(--ink-soft); background:var(--line-soft); border-color:transparent; }
  table .btn-del{ padding:5px 10px; font-size:11.3px; margin-left:0; }

  .right-panel{ width:288px; flex:0 0 288px; display:flex; flex-direction:column; gap:16px; }
  .panel-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .panel-title{ font-size:13px; font-weight:700; margin:0 0 12px; }
  .upcoming-item{ display:flex; gap:10px; padding:8px 0; }
  .upcoming-item .bar{ width:3px; border-radius:99px; align-self:stretch; }
  .upcoming-item .meta{ font-size:11px; color:var(--ink-faint); margin-bottom:2px; }
  .upcoming-item .title{ font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.35; }
  .upcoming-item + .upcoming-item{ border-top:1px solid var(--line-soft); }
  .activity-item{ display:flex; gap:10px; padding:9px 0; }
  .activity-item + .activity-item{ border-top:1px solid var(--line-soft); }
  .activity-item .dot{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; flex:0 0 26px; }
  .activity-item .txt{ font-size:12.3px; color:var(--ink-soft); line-height:1.4; }
  .activity-item .txt b{ color:var(--ink); font-weight:600; }
  .activity-item .txt .who{ color:var(--accent-dark); font-weight:600; }
  .activity-item .time{ font-size:10.8px; color:var(--ink-faint); margin-top:2px; }

  /* ---------------- modal ---------------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(17,21,33,.48); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; opacity:0; transition:opacity .15s ease; }
  .modal-overlay.show{ opacity:1; }
  .modal-box{ background:var(--panel); border-radius:16px; width:100%; max-width:460px; box-shadow:var(--shadow-modal); max-height:88vh; display:flex; flex-direction:column; transform:translateY(8px); transition:transform .15s ease; }
  .modal-overlay.show .modal-box{ transform:translateY(0); }
  .modal-box.wide{ max-width:620px; }
  .modal-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 22px 4px; }
  .modal-header h2{ font-size:16.5px; margin:0; font-weight:700; }
  .modal-header .modal-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .modal-close{ background:none; border:none; color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 2px; white-space:nowrap; }
  .modal-close:hover{ color:var(--ink); text-decoration:underline; }
  .modal-body{ padding:16px 22px 22px; overflow-y:auto; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field .req{ color:var(--rust); }
  .field input[type=text], .field input[type=date], .field input[type=url], .field select, .field textarea{ width:100%; border:1px solid var(--line); background:var(--bg); border-radius:var(--radius-sm); padding:9px 11px; font-size:13px; color:var(--ink); resize:vertical; }
  .field textarea{ min-height:72px; line-height:1.4; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .field-error{ font-size:11.5px; color:var(--rust); margin-top:5px; display:none; }
  .field.invalid input, .field.invalid textarea{ border-color:var(--rust); background:var(--rust-soft); }
  .field.invalid .field-error{ display:block; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .modal-note{ background:var(--bg); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.3px; color:var(--ink-soft); margin-bottom:16px; }
  .modal-note b{ color:var(--ink); }
  .modal-footer{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .modal-footer .btn{ padding:9px 18px; font-size:12.8px; }
  .modal-footer .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .modal-footer .btn-primary:hover{ background:var(--accent-dark); }
  .modal-footer .btn-primary.sage{ background:var(--sage); border-color:var(--sage); }
  .modal-footer .btn-primary.sage:hover{ background:var(--sage-dark); }
  .modal-footer .btn-primary.danger{ background:var(--rust); border-color:var(--rust); }
  .modal-footer .btn-primary.danger:hover{ background:var(--rust-dark); }
  .detail-meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:16px; }
  .detail-meta .mi-label{ font-size:10.8px; color:var(--ink-faint); font-weight:700; letter-spacing:.02em; margin-bottom:2px; }
  .detail-meta .mi-val{ font-size:12.8px; color:var(--ink); }
  .detail-desc{ font-size:12.8px; color:var(--ink-soft); background:var(--bg); border-radius:var(--radius-sm); padding:12px; margin-bottom:16px; white-space:pre-wrap; line-height:1.5; }
  .detail-section-title{ font-size:12px; font-weight:700; color:var(--ink); margin:0 0 8px; }
  .notes-thread{ display:flex; flex-direction:column; gap:10px; max-height:220px; overflow-y:auto; margin-bottom:14px; padding-right:4px; }
  .note-item{ display:flex; gap:9px; }
  .note-item .dot{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:#fff; flex:0 0 24px; }
  .note-item .note-body{ background:var(--bg); border-radius:var(--radius-sm); padding:9px 11px; flex:1; }
  .note-item .note-head{ display:flex; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .note-item .note-who{ font-size:11.8px; font-weight:700; color:var(--ink); }
  .note-item .note-time{ font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
  .note-item .note-type{ display:inline-block; font-size:9.8px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--accent-dark); margin-bottom:3px; }
  .note-item .note-txt{ font-size:12.3px; color:var(--ink-soft); white-space:pre-wrap; line-height:1.4; }
  .add-note-row{ display:flex; gap:8px; align-items:flex-start; }
  .add-note-row textarea{ flex:1; min-height:44px; }
  .add-note-row button{ flex:0 0 auto; }
  .detail-footer{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }

  .toast-root{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast{ background:var(--ink); color:#fff; font-size:12.8px; padding:11px 16px; border-radius:var(--radius-sm); box-shadow:0 8px 24px rgba(0,0,0,.2); opacity:0; transform:translateY(6px); transition:all .2s ease; max-width:300px; }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ background:var(--sage-dark); }
  .toast.danger{ background:var(--rust-dark); }

  .logout-btn.has-unread{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:700; }

  .notif-list{ display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; }
  .notif-item{ display:flex; gap:10px; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--panel); cursor:pointer; text-align:left; width:100%; }
  .notif-item:hover{ background:var(--line-soft); }
  .notif-item.unread{ background:var(--accent-soft); border-color:#B9CBFA; }
  .notif-item .bar{ width:3px; border-radius:99px; align-self:stretch; flex:0 0 3px; }
  .notif-item .bar.vencida{ background:var(--rust); }
  .notif-item .bar.prazo_proximo{ background:var(--amber); }
  .notif-item .bar.atribuida{ background:var(--accent); }
  .notif-item .txt{ font-size:12.6px; color:var(--ink); line-height:1.4; flex:1; }
  .notif-item.unread .txt{ font-weight:600; }
  .notif-item .time{ font-size:11px; color:var(--ink-faint); margin-top:3px; }
  .notif-header-actions{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .notif-header-actions button{ font-size:12px; color:var(--accent-dark); background:none; border:none; cursor:pointer; font-weight:600; }
  .notif-header-actions button:hover{ text-decoration:underline; }

  .anexos-list{ display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
  .anexo-item{ display:flex; align-items:center; gap:10px; padding:9px 11px; background:var(--bg); border-radius:var(--radius-sm); }
  .anexo-item .icon{ width:28px; height:28px; border-radius:8px; background:var(--accent-soft); color:var(--accent-dark); flex:0 0 28px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .anexo-item .info{ flex:1; min-width:0; }
  .anexo-item .info a{ font-size:12.6px; font-weight:600; color:var(--ink); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .anexo-item .info a:hover{ color:var(--accent-dark); text-decoration:underline; }
  .anexo-item .info .meta{ font-size:11px; color:var(--ink-faint); }
  .anexo-item .remove{ background:none; border:none; color:var(--rust); font-size:11.5px; font-weight:600; cursor:pointer; flex:0 0 auto; }
  .anexo-item .remove:hover{ text-decoration:underline; }
  .anexo-upload-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  #anexoUploadStatus{ font-size:11.5px; color:var(--ink-faint); }

  @media (max-width:1180px){ .right-panel{ display:none; } }
  @media (max-width:960px){ .sidebar{ display:none; } .board{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .modal-box{ max-width:100%; } .field-row{ flex-direction:column; gap:0; } .detail-meta{ grid-template-columns:1fr; } }
</style>
</head>

function escapeHtml(str){ return String(str==null?"":str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function colorForEmail(email){
  if(!email) return "#9AA0AC";
  let hash = 0;
  for(let i=0;i<email.length;i++) hash = (hash*31 + email.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
}
function nomeForEmail(email){
  if(!email) return "Sem responsável";
  const u = usuarios.find(x => x.email === email);
  return u ? u.nome : email;
}
function initialsFor(nome){
  return String(nome||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || "?";
}

/* ================= API ================= */
async function apiCall(method, action, payload){
  try{
    let res;
    if(method === 'GET'){
      const params = new URLSearchParams(Object.assign({ action, idToken: idToken || '' }, payload || {}));
      res = await fetch(API_URL + '?' + params.toString());
    } else {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action, idToken }, payload || {}))
      });
    }
    const data = await res.json();
    if(data.error){
      toast(data.error, 'danger');
      if(/token|bloqueado/i.test(data.error)) logout();
      return null;
    }
    return data;
  } catch(err){
    console.error(err);
    toast('Falha de conexão com o servidor. Verifique sua internet e tente de novo.', 'danger');
    return null;
  }
}

/* ================= AUTH ================= */
function initGoogleSignIn(){
  if(!window.google || !google.accounts) { setTimeout(initGoogleSignIn, 300); return; }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse, auto_select: false });
  google.accounts.id.renderButton(document.getElementById('googleSignInDiv'), { theme:'outline', size:'large', text:'signin_with', width:280 });
  if(idToken){ tryResumeSession(); }
}

async function tryResumeSession(){
  setLoginStatus('Entrando...');
  const ok = await loadEverything();
  if(ok){ showApp(); } else { idToken = null; sessionStorage.removeItem('plano-crm-idToken'); setLoginStatus(''); }
}

async function handleCredentialResponse(response){
  idToken = response.credential;
  sessionStorage.setItem('plano-crm-idToken', idToken);
  setLoginStatus('Entrando...');
  const ok = await loadEverything();
  if(ok){ showApp(); } else { setLoginStatus('Não foi possível entrar. Tente novamente.', true); }
}

function setLoginStatus(msg, isErr){
  const el = document.getElementById('loginStatus');
  el.textContent = msg || '';
  el.classList.toggle('err', !!isErr);
}

function logout(){
  idToken = null;
  sessionStorage.removeItem('plano-crm-idToken');
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginScreen').classList.remove('hidden');
  setLoginStatus('');
}

function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.add('show');
  document.getElementById('whoLabel').innerHTML = `${escapeHtml(currentUser.nome)}<span class="email">${escapeHtml(currentUser.email)}</span>`;
  const av = document.getElementById('whoAvatar');
  if(currentUser.foto_url){ av.innerHTML = `<img src="${escapeHtml(currentUser.foto_url)}" alt="">`; }
  else { av.textContent = initialsFor(currentUser.nome); av.style.background = colorForEmail(currentUser.email); }
  updateNotifButton();
  render();
}

/* ================= NOTIFICATIONS ================= */
function notifTypeLabel(tipo){
  if(tipo === 'vencida') return 'Prazo vencido';
  if(tipo === 'prazo_proximo') return 'Prazo próximo';
  if(tipo === 'atribuida') return 'Nova atribuição';
  return 'Notificação';
}
function renderNotifList(list){
  if(!list.length) return `<div class="empty-hint">Nenhuma notificação por aqui.</div>`;
  return list.map(n => `
    <button class="notif-item ${n.lida !== true ? 'unread' : ''}" data-id="${n.id}" data-tarefa="${n.tarefa_id||''}">
      <span class="bar ${n.tipo}"></span>
      <div>
        <div class="txt">${escapeHtml(n.texto)}</div>
        <div class="time">${notifTypeLabel(n.tipo)} · ${escapeHtml(String(n.criado_em).slice(0,16).replace('T',' '))}</div>
      </div>
    </button>`).join('');
}
async function openNotifModal(){
  const wrap = openModal({
    title: 'Notificações',
    bodyHtml: `
      <div class="notif-header-actions"><button type="button" id="marcarTodasBtn">Marcar todas como lidas</button></div>
      <div class="notif-list" id="notifList"><div class="empty-hint">Carregando...</div></div>`,
    onMount: (wrap) => {
      wrap.querySelector('#marcarTodasBtn').addEventListener('click', async () => {
        const data = await apiCall('POST', 'marcarTodasLidas', {});
        if(!data) return;
        toast('Notificações marcadas como lidas.', 'success');
        await refreshNotifModal(wrap);
        applyBootData(data); updateNotifButton();
      });
    }
  });
  await refreshNotifModal(wrap);
}
async function refreshNotifModal(wrap){
  const list = await apiCall('GET', 'notificacoes');
  const listEl = wrap.querySelector('#notifList');
  if(!listEl) return;
  listEl.innerHTML = renderNotifList(list || []);
  listEl.querySelectorAll('.notif-item').forEach(item => {
    item.addEventListener('click', async () => {
      const id = item.dataset.id; const tarefaId = item.dataset.tarefa;
      if(item.classList.contains('unread')){
        await apiCall('POST', 'marcarNotificacaoLida', { id });
        notifCount = Math.max(0, notifCount - 1); updateNotifButton();
      }
      if(tarefaId){ closeModal(); openDetailModal(tarefaId); }
      else { item.classList.remove('unread'); }
    });
  });
}

/* ================= DATA LOADING ================= */
async function loadEverything(){
  const [boot, usuariosResp] = await Promise.all([
    apiCall('GET', 'bootstrap'),
    apiCall('GET', 'usuarios')
  ]);
  if(!boot) return false;
  currentUser = boot.usuario;
  tasks = (boot.tarefas || []).map(t => Object.assign({}, t, { fase: Number(t.fase) }));
  activity = boot.atividade || [];
  notifCount = boot.notificacoesNaoLidas || 0;
  usuarios = usuariosResp || [ { email: currentUser.email, nome: currentUser.nome, foto_url: currentUser.foto_url } ];
  return true;
}
function updateNotifButton(){
  const btn = document.getElementById('notifBtn');
  btn.textContent = notifCount > 0 ? `Notificações (${notifCount})` : 'Notificações';
  btn.classList.toggle('has-unread', notifCount > 0);
}

/* Aplica o estado atualizado do quadro que já vem embutido na resposta de
   qualquer ação (POST) — evita ter que fazer uma nova chamada ao servidor
   só pra atualizar a tela depois de criar/mover/editar uma tarefa. */
function applyBootData(data){
  if(!data) return;
  if(data.tarefas) tasks = data.tarefas.map(t => Object.assign({}, t, { fase: Number(t.fase) }));
  if(data.atividade) activity = data.atividade;
  if(data.notificacoesNaoLidas !== undefined) notifCount = data.notificacoesNaoLidas;
}

/* ================= TOASTS ================= */
function toast(msg, type){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 3200);
}

/* ================= MODAL SHELL ================= */
function closeModal(){
  const overlay = document.querySelector('.modal-overlay');
  if(overlay){ overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 150); }
  document.removeEventListener('keydown', modalEscHandler);
}
function modalEscHandler(e){ if(e.key === 'Escape') closeModal(); }
function openModal({title, subtitle, wide, bodyHtml, onMount}){
  closeModal();
  const container = document.getElementById('modalContainer');
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.innerHTML = `<div class="modal-box ${wide?'wide':''}" role="dialog" aria-modal="true">
      <div class="modal-header"><div><h2>${title}</h2>${subtitle?`<div class="modal-sub">${subtitle}</div>`:''}</div>
      <button class="modal-close" id="modalCloseX">Fechar</button></div>
      <div class="modal-body">${bodyHtml}</div></div>`;
  container.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('show'));
  wrap.addEventListener('mousedown', e => { if(e.target === wrap) closeModal(); });
  wrap.querySelector('#modalCloseX').addEventListener('click', closeModal);
  document.addEventListener('keydown', modalEscHandler);
  if(onMount) onMount(wrap);
  const firstField = wrap.querySelector('input, textarea, select');
  if(firstField) setTimeout(() => firstField.focus(), 50);
  return wrap;
}
function markInvalid(fieldEl, msg){ fieldEl.classList.add('invalid'); const err = fieldEl.querySelector('.field-error'); if(err) err.textContent = msg; }
function clearInvalid(fieldEl){ fieldEl.classList.remove('invalid'); }

/* ================= DETAIL + NOTES ================= */
function noteTypeLabel(tipo){ return tipo === 'inicio' ? 'Início' : (tipo === 'conclusao' ? 'Conclusão' : 'Nota'); }
function renderNotesThread(notas){
  if(!notas || !notas.length) return `<div class="empty-hint">Nenhuma nota registrada ainda.</div>`;
  return notas.map(n => `
    <div class="note-item">
      <span class="dot" style="background:${colorForEmail(n.autor_email)}">${initialsFor(nomeForEmail(n.autor_email))}</span>
      <div class="note-body">
        <div class="note-head"><span class="note-who">${escapeHtml(nomeForEmail(n.autor_email))}</span><span class="note-time">${escapeHtml(String(n.criado_em).slice(0,16).replace('T',' '))}</span></div>
        <div class="note-type">${noteTypeLabel(n.tipo)}</div>
        <div class="note-txt">${escapeHtml(n.texto)}</div>
      </div>
    </div>`).join('');
}

async function openDetailModal(taskId){
  const t = tasks.find(x => x.id === taskId); if(!t) return;
  const overdue = isOverdue(t.prazo, t.status);
  const wrap = openModal({
    title: escapeHtml(t.titulo), wide: true,
    bodyHtml: `
      <div class="tag-row">
        <span class="fase-tag">Fase ${t.fase} · ${escapeHtml(FASE_LABELS[t.fase]||'')}</span>
        <span class="prio-tag prio-${t.prioridade}">${PRIORIDADES[t.prioridade]}</span>
      </div>
      <div class="detail-meta">
        <div><div class="mi-label">RESPONSÁVEL</div><div class="mi-val">${escapeHtml(nomeForEmail(t.responsavel_email))}</div></div>
        <div><div class="mi-label">STATUS</div><div class="mi-val">${statusLabel(t.status)}</div></div>
        <div><div class="mi-label">PRAZO</div><div class="mi-val" style="${overdue?'color:var(--rust);font-weight:700;':''}">${t.prazo ? t.prazo.split('-').reverse().join('/') + (overdue?' · vencido':'') : 'Sem prazo definido'}</div></div>
        <div><div class="mi-label">CRIADA EM</div><div class="mi-val">${escapeHtml(String(t.criado_em).slice(0,10).split('-').reverse().join('/'))}</div></div>
        ${t.iniciado_em ? `<div><div class="mi-label">INICIADA EM</div><div class="mi-val">${escapeHtml(String(t.iniciado_em).slice(0,10).split('-').reverse().join('/'))}</div></div>` : ''}
        ${t.concluido_em ? `<div><div class="mi-label">CONCLUÍDA EM</div><div class="mi-val">${escapeHtml(String(t.concluido_em).slice(0,10).split('-').reverse().join('/'))}</div></div>` : ''}
      </div>
      ${t.descricao ? `<div class="detail-section-title">Descrição</div><div class="detail-desc">${escapeHtml(t.descricao)}</div>` : ''}
      ${t.link_entregavel ? `<div class="detail-section-title">Link do entregável</div><div class="detail-desc"><a href="${escapeHtml(t.link_entregavel)}" target="_blank" rel="noopener">${escapeHtml(t.link_entregavel)}</a></div>` : ''}
      <div class="detail-section-title">Anexos</div>
      <div class="anexos-list" id="anexosList"><div class="empty-hint">Carregando...</div></div>
      <div class="anexo-upload-row">
        <input type="file" id="anexoFileInput" class="hidden">
        <button type="button" class="btn btn-neutral" id="anexoUploadBtn">Anexar arquivo</button>
        <span id="anexoUploadStatus"></span>
      </div>
      <div class="detail-section-title">Histórico</div>
      <div class="notes-thread" id="notesThread"><div class="empty-hint">Carregando...</div></div>
      <div class="add-note-row">
        <textarea id="quickNote" maxlength="400" placeholder="Adicionar uma nota de atualização..."></textarea>
        <button type="button" class="btn btn-neutral" id="addNoteBtn">Adicionar nota</button>
      </div>
      <div class="detail-footer">
        <button type="button" class="btn btn-neutral" id="d-edit">Editar</button>
        ${t.status !== 'todo' ? `<button type="button" class="btn btn-neutral" id="d-todo">Voltar para a fazer</button>` : ''}
        ${t.status !== 'doing' ? `<button type="button" class="btn ${t.status==='todo'?'btn-start':'btn-neutral'}" id="d-start">${t.status==='todo'?'Iniciar':'Reabrir'}</button>` : ''}
        ${t.status !== 'done' ? `<button type="button" class="btn btn-done" id="d-done">Concluir</button>` : ''}
        <button type="button" class="btn btn-del" id="d-del">Excluir</button>
      </div>`,
    onMount: (wrap) => {
      wrap.querySelector('#d-edit').addEventListener('click', () => openEditModal(taskId));
      const todoBtn = wrap.querySelector('#d-todo');
      if(todoBtn) todoBtn.addEventListener('click', async () => {
        const data = await apiCall('POST', 'moverTarefa', { id: t.id, status: 'todo' });
        if(!data) return; closeModal(); toast('Tarefa movida para A fazer.', 'success'); applyBootData(data); render();
      });
      const startBtn = wrap.querySelector('#d-start');
      if(startBtn) startBtn.addEventListener('click', () => { closeModal(); openStartModal(taskId); });
      const doneBtn = wrap.querySelector('#d-done');
      if(doneBtn) doneBtn.addEventListener('click', () => { closeModal(); openCompleteModal(taskId); });
      wrap.querySelector('#d-del').addEventListener('click', () => { closeModal(); openDeleteModal(taskId); });
      wireAnexoUpload(wrap, t.id);
      wrap.querySelector('#addNoteBtn').addEventListener('click', async () => {
        const ta = wrap.querySelector('#quickNote'); const texto = ta.value.trim();
        if(!texto){ ta.focus(); return; }
        const data = await apiCall('POST', 'adicionarNota', { tarefaId: t.id, texto, tipo: 'nota' });
        if(!data) return;
        ta.value = '';
        const notasResp = await apiCall('GET', 'notas', { tarefaId: t.id });
        wrap.querySelector('#notesThread').innerHTML = renderNotesThread(notasResp || []);
        applyBootData(data); updateNotifButton();
      });
    }
  });
  const notasResp = await apiCall('GET', 'notas', { tarefaId: t.id });
  const threadEl = wrap.querySelector('#notesThread');
  if(threadEl) threadEl.innerHTML = renderNotesThread(notasResp || []);
  await loadAnexosInto(wrap, t.id);
}

/* ================= ANEXOS ================= */
const MAX_ANEXO_BYTES = 8 * 1024 * 1024; // 8MB — limite prático pra não travar o upload

function fileIconLabel(nome){
  const ext = (nome.split('.').pop() || '').slice(0,4).toUpperCase();
  return ext || '?';
}
function renderAnexosList(anexos, taskId){
  if(!anexos.length) return `<div class="empty-hint">Nenhum anexo ainda.</div>`;
  return anexos.map(a => `
    <div class="anexo-item" data-anexo-id="${a.id}">
      <span class="icon">${escapeHtml(fileIconLabel(a.nome_arquivo))}</span>
      <div class="info">
        <a href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.nome_arquivo)}</a>
        <div class="meta">${escapeHtml(nomeForEmail(a.enviado_por))} · ${escapeHtml(String(a.criado_em).slice(0,10).split('-').reverse().join('/'))}</div>
      </div>
      <button type="button" class="remove" data-remove-anexo="${a.id}" data-task="${taskId}">Remover</button>
    </div>`).join('');
}
async function loadAnexosInto(wrap, taskId){
  const anexos = await apiCall('GET', 'anexos', { tarefaId: taskId });
  const el = wrap.querySelector('#anexosList');
  if(!el) return;
  el.innerHTML = renderAnexosList(anexos || [], taskId);
  el.querySelectorAll('[data-remove-anexo]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const data = await apiCall('POST', 'excluirAnexo', { id: btn.dataset.removeAnexo });
      if(!data) return;
      toast('Anexo removido.', 'success');
      await loadAnexosInto(wrap, taskId);
    });
  });
}
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function wireAnexoUpload(wrap, taskId){
  const input = wrap.querySelector('#anexoFileInput');
  const btn = wrap.querySelector('#anexoUploadBtn');
  const status = wrap.querySelector('#anexoUploadStatus');
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if(!file) return;
    if(file.size > MAX_ANEXO_BYTES){
      toast('Arquivo maior que 8MB — não é possível anexar.', 'danger');
      input.value = ''; return;
    }
    status.textContent = 'Enviando ' + file.name + '...';
    btn.disabled = true;
    try{
      const base64 = await fileToBase64(file);
      const data = await apiCall('POST', 'uploadAnexo', {
        tarefaId: taskId, nomeArquivo: file.name, mimeType: file.type || 'application/octet-stream', conteudoBase64: base64
      });
      if(data){ toast('Anexo enviado.', 'success'); await loadAnexosInto(wrap, taskId); applyBootData(data); }
    } finally {
      status.textContent = ''; btn.disabled = false; input.value = '';
    }
  });
}


function populatePhaseList(){
  const wrap = document.getElementById('phaseList');
  let html = `<div class="phase-item ${activeFaseFilter==='all'?'active':''}" data-fase="all"><div class="num">·</div><div class="label">Todas as fases</div></div>`;
  Object.keys(FASE_LABELS).forEach(f => {
    const pct = phaseProgress(f);
    html += `<div class="phase-item ${String(activeFaseFilter)===f?'active':''}" data-fase="${f}">
      <div class="num">${f}</div><div class="label">${FASE_LABELS[f]}</div>
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div></div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.phase-item').forEach(item => {
    item.addEventListener('click', () => {
      activeFaseFilter = item.dataset.fase;
      const title = activeFaseFilter === 'all' ? 'Todas as fases' : ('Fase ' + activeFaseFilter + ' · ' + FASE_LABELS[activeFaseFilter]);
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('subbarTitle').textContent = title;
      populatePhaseList(); render();
    });
  });
}
function phaseProgress(fase){
  const ft = tasks.filter(t => String(t.fase) === String(fase));
  if(!ft.length) return 0;
  return Math.round((ft.filter(t=>t.status==='done').length / ft.length) * 100);
}
function populateRespFilters(){
  const wrap = document.getElementById('respFilters');
  let html = `<span class="avatar-chip ${activeRespFilter==='all'?'active':''}" data-resp="all">Todos</span>`;
  usuarios.forEach(u => {
    html += `<span class="avatar-chip ${activeRespFilter===u.email?'active':''}" data-resp="${escapeHtml(u.email)}"><span class="dot" style="background:${colorForEmail(u.email)}">${initialsFor(u.nome)}</span>${escapeHtml(u.nome)}</span>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.avatar-chip').forEach(chip => {
    chip.addEventListener('click', () => { activeRespFilter = chip.dataset.resp; populateRespFilters(); render(); });
  });
}

function isOverdue(prazo, status){
  if(!prazo || status === 'done') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(prazo + 'T00:00:00') < today;
}
function passesFilters(t){
  if(activeRespFilter !== 'all' && t.responsavel_email !== activeRespFilter) return false;
  if(activeFaseFilter !== 'all' && String(t.fase) !== String(activeFaseFilter)) return false;
  if(searchTerm){
    const s = searchTerm.toLowerCase();
    if(!t.titulo.toLowerCase().includes(s) && !(t.descricao||'').toLowerCase().includes(s)) return false;
  }
  return true;
}

/* ================= CARD / ROW RENDERING ================= */
function cardHTML(t){
  const overdueClass = isOverdue(t.prazo, t.status) ? 'overdue' : '';
  const color = colorForEmail(t.responsavel_email);
  return `
  <div class="card" draggable="true" data-id="${t.id}">
    <div class="tag-row">
      <span class="fase-tag">Fase ${t.fase} · ${escapeHtml(FASE_LABELS[t.fase]||'')}</span>
      <span class="prio-tag prio-${t.prioridade}">${PRIORIDADES[t.prioridade]||'Média'}</span>
    </div>
    <h3 data-detail="${t.id}">${escapeHtml(t.titulo)}</h3>
    <div class="card-row">
      <div class="resp-pill">
        <span class="dot" style="background:${color}">${initialsFor(nomeForEmail(t.responsavel_email))}</span>
        <select class="resp-select" data-id="${t.id}">${respOptionsHtml(t.responsavel_email)}</select>
      </div>
      <input type="date" class="prazo-input ${overdueClass}" data-id="${t.id}" value="${t.prazo||''}">
    </div>
    <div class="card-actions">
      ${t.status !== 'todo' ? `<button class="btn btn-neutral" data-id="${t.id}" data-move="todo">A fazer</button>` : ''}
      ${t.status !== 'doing' ? `<button class="btn ${t.status==='todo'?'btn-start':'btn-neutral'}" data-id="${t.id}" data-start="1">${t.status==='todo'?'Iniciar':'Reabrir'}</button>` : ''}
      ${t.status !== 'done' ? `<button class="btn btn-done" data-id="${t.id}" data-complete="1">Concluir</button>` : ''}
      <button class="btn btn-del" data-id="${t.id}" data-del="1">Excluir</button>
    </div>
  </div>`;
}
function renderKanban(visible){
  ['todo','doing','done'].forEach(s => {
    const list = document.getElementById('list-' + s);
    const items = visible.filter(t => t.status === s).sort((a,b)=>(a.fase-b.fase)||(a.prazo||'').localeCompare(b.prazo||''));
    document.getElementById('count-'+s).textContent = items.length;
    list.innerHTML = (items.length ? items.map(cardHTML).join('') : `<div class="empty-hint">Sem tarefas aqui</div>`)
      + (s==='todo' ? `<button class="add-inline-btn" id="addInlineBtn">Nova tarefa</button>` : '');
  });
  const inlineBtn = document.getElementById('addInlineBtn');
  if(inlineBtn) inlineBtn.addEventListener('click', openNewTaskModal);
}
function renderList(visible){
  const body = document.getElementById('listBody');
  const items = [...visible].sort((a,b)=>(a.fase-b.fase)||(a.prazo||'').localeCompare(b.prazo||''));
  body.innerHTML = items.map(t => {
    const overdueClass = isOverdue(t.prazo, t.status) ? 'overdue' : '';
    return `<tr>
      <td>Fase ${t.fase}</td><td><button class="list-title-btn" data-detail="${t.id}">${escapeHtml(t.titulo)}</button></td>
      <td><select class="resp-select" data-id="${t.id}">${respOptionsHtml(t.responsavel_email)}</select></td>
      <td><input type="date" class="prazo-input ${overdueClass}" data-id="${t.id}" value="${t.prazo||''}"></td>
      <td><select class="status-select" data-id="${t.id}" data-val="${t.status}">
        <option value="todo" ${t.status==='todo'?'selected':''}>A fazer</option>
        <option value="doing" ${t.status==='doing'?'selected':''}>Em andamento</option>
        <option value="done" ${t.status==='done'?'selected':''}>Concluído</option></select></td>
      <td><button class="btn btn-del" data-id="${t.id}" data-del="1">Excluir</button></td></tr>`;
  }).join('') || `<tr><td colspan="6"><div class="empty-hint">Nenhuma tarefa encontrada</div></td></tr>`;

  body.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const t = tasks.find(x=>x.id===sel.dataset.id); if(!t) return;
      if(sel.value === 'doing' && t.status === 'todo'){ sel.value = t.status; openStartModal(t.id); return; }
      if(sel.value === 'done'){ sel.value = t.status; openCompleteModal(t.id); return; }
      const data = await apiCall('POST', 'moverTarefa', { id: t.id, status: sel.value });
      if(!data) return; toast('Status atualizado.', 'success'); applyBootData(data); render();
    });
  });
  body.querySelectorAll('[data-detail]').forEach(btn => btn.addEventListener('click', () => openDetailModal(btn.dataset.detail)));
  body.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => openDeleteModal(btn.dataset.id)));
  body.querySelectorAll('.resp-select').forEach(sel => sel.addEventListener('change', () => reassign(sel.dataset.id, sel.value)));
  body.querySelectorAll('.prazo-input').forEach(inp => inp.addEventListener('change', () => reprazo(inp.dataset.id, inp.value)));
}

function statusLabel(s){ return s==='todo'?'A fazer':(s==='doing'?'Em andamento':'Concluído'); }

async function reassign(id, email){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const data = await apiCall('POST', 'editarTarefa', { id, titulo: t.titulo, fase: t.fase, prioridade: t.prioridade, responsavelEmail: email, prazo: t.prazo, descricao: t.descricao||'' });
  if(!data) return; toast('Responsável atualizado.', 'success'); applyBootData(data); render();
}
async function reprazo(id, prazo){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const data = await apiCall('POST', 'editarTarefa', { id, titulo: t.titulo, fase: t.fase, prioridade: t.prioridade, responsavelEmail: t.responsavel_email, prazo, descricao: t.descricao||'' });
  if(!data) return; toast('Prazo atualizado.', 'success'); applyBootData(data); render();
}

/* ================= PANELS ================= */
function renderUpcoming(){
  const wrap = document.getElementById('upcomingList');
  const items = tasks.filter(t => t.status !== 'done' && t.prazo).sort((a,b) => a.prazo.localeCompare(b.prazo)).slice(0,6);
  wrap.innerHTML = items.length ? items.map(t => `
    <div class="upcoming-item">
      <div class="bar" style="background:${colorForEmail(t.responsavel_email)}"></div>
      <div><div class="meta">${escapeHtml(t.prazo.split('-').reverse().join('/'))} · Fase ${t.fase}</div><div class="title">${escapeHtml(t.titulo)}</div></div>
    </div>`).join('') : `<div class="empty-hint">Nenhum prazo em aberto</div>`;
}
function renderActivity(){
  const wrap = document.getElementById('activityList');
  wrap.innerHTML = activity.length ? activity.slice(0,10).map(a => `
    <div class="activity-item">
      <span class="dot" style="background:${colorForEmail(a.autor_email)}">${initialsFor(nomeForEmail(a.autor_email))}</span>
      <div><div class="txt"><span class="who">${escapeHtml(nomeForEmail(a.autor_email))}</span> ${escapeHtml(a.texto)}</div>
      <div class="time">${escapeHtml(String(a.criado_em).slice(0,16).replace('T',' '))}</div></div>
    </div>`).join('') : `<div class="empty-hint">Sem atividade ainda</div>`;
}

/* ================= MAIN RENDER ================= */
function render(){
  updateNotifButton();
  const visible = tasks.filter(passesFilters);
  if(currentView === 'kanban'){ renderKanban(visible); } else { renderList(visible); }
  const total = tasks.length; const done = tasks.filter(t => t.status === 'done').length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '% concluído';
  attachSharedEvents(); populatePhaseList(); populateRespFilters(); renderUpcoming(); renderActivity();
}
function attachSharedEvents(){
  document.querySelectorAll('.resp-select').forEach(sel => sel.addEventListener('change', () => reassign(sel.dataset.id, sel.value)));
  document.querySelectorAll('.prazo-input').forEach(inp => inp.addEventListener('change', () => reprazo(inp.dataset.id, inp.value)));
  document.querySelectorAll('[data-move]').forEach(btn => btn.addEventListener('click', async () => {
    const data = await apiCall('POST', 'moverTarefa', { id: btn.dataset.id, status: btn.dataset.move });
    if(!data) return; toast('Status atualizado.', 'success'); applyBootData(data); render();
  }));
  document.querySelectorAll('[data-start]').forEach(btn => btn.addEventListener('click', () => {
    const t = tasks.find(x => x.id === btn.dataset.id);
    if(t && t.status === 'doing'){
      (async () => { const data = await apiCall('POST','moverTarefa',{id:t.id,status:'doing'}); if(!data) return; toast('Tarefa reaberta.','success'); applyBootData(data); render(); })();
    } else { openStartModal(btn.dataset.id); }
  }));
  document.querySelectorAll('[data-complete]').forEach(btn => btn.addEventListener('click', () => openCompleteModal(btn.dataset.id)));
  document.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => openDeleteModal(btn.dataset.id)));
  document.querySelectorAll('[data-detail]').forEach(el => el.addEventListener('click', () => openDetailModal(el.dataset.detail)));
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('dragstart', () => { draggedId = card.dataset.id; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); draggedId = null; });
  });
}
function attachColumnDrop(){
  document.querySelectorAll('.card-list').forEach(list => {
    list.addEventListener('dragover', e => { e.preventDefault(); list.classList.add('drag-over'); });
    list.addEventListener('dragleave', () => list.classList.remove('drag-over'));
    list.addEventListener('drop', async e => {
      e.preventDefault(); list.classList.remove('drag-over');
      if(!draggedId) return;
      const t = tasks.find(x => x.id === draggedId); if(!t) return;
      const targetStatus = list.dataset.status;
      if(targetStatus === 'doing' && t.status === 'todo'){ openStartModal(t.id); return; }
      if(targetStatus === 'done'){ openCompleteModal(t.id); return; }
      const data = await apiCall('POST', 'moverTarefa', { id: t.id, status: targetStatus });
      if(!data) return; toast('Status atualizado.', 'success'); applyBootData(data); render();
    });
  });
}

document.getElementById('addTaskBtn').addEventListener('click', openNewTaskModal);
document.getElementById('search').addEventListener('input', e => { searchTerm = e.target.value; render(); });
document.getElementById('viewKanbanBtn').addEventListener('click', () => {
  currentView = 'kanban';
  document.getElementById('viewKanbanBtn').classList.add('active'); document.getElementById('viewListBtn').classList.remove('active');
  document.getElementById('board').classList.remove('hidden'); document.getElementById('listView').classList.add('hidden');
  render();
});
document.getElementById('viewListBtn').addEventListener('click', () => {
  currentView = 'list';
  document.getElementById('viewListBtn').classList.add('active'); document.getElementById('viewKanbanBtn').classList.remove('active');
  document.getElementById('listView').classList.remove('hidden'); document.getElementById('board').classList.add('hidden');
  render();
});

attachColumnDrop();
</script>
